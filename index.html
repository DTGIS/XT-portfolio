<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portfolio - Phạm Thị Xuân Trúc</title>
    
    <!-- Tích hợp font Inter cho giao diện hiện đại -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --primary-color: #1e88e5;
        --primary-hover: #1565c0;
        --text-main: #000000;
        --text-muted: #333333;
        --bg-body: #f8f9fa;
        --bg-card: #ffffff;
        --border-color: #e2e8f0;
        --border-radius: 10px;
        --transition-speed: 0.3s;
    }

    body {
        font-family: 'Inter', "Segoe UI", Roboto, Arial, sans-serif;
        max-width: 1000px;
        margin: auto;
        padding: 30px 20px;
        background-color: var(--bg-body);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
    }

    header {
        display: flex;
        align-items: center;
        background: linear-gradient(135deg, #ffffff 0%, #f4f6f8 100%);
        padding: 35px 30px;
        border-radius: var(--border-radius);
        margin-bottom: 25px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        border-left: 6px solid #4a6572;
    }

    .avatar-container { flex-shrink: 0; margin-right: 35px; }
    .avatar-container img { height: 220px; width: 220px; border-radius: 50%; border: 4px solid white; box-shadow: 0 8px 16px rgba(0,0,0,0.08); object-fit: cover; }

    h1 { font-size: 2.2rem; margin: 0 0 10px 0; color: #000000; font-weight: 700; }
    .info { text-align: justify; color: var(--text-muted); font-size: 1rem; margin: 0; }
    .quote-container { text-align: center; font-style: italic; margin-bottom: 35px; color: #000000; font-size: 1.1rem; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-top: 15px; gap: 6px; flex-wrap: wrap; }
    .tab-button { flex: 1; min-width: 150px; padding: 12px 10px; border: none; background: transparent; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: 500; color: #333333; transition: all 0.3s ease; }
    .tab-button.active { background: var(--bg-card); color: var(--primary-color); font-weight: 600; border: 2px solid var(--border-color); border-bottom: 2px solid var(--bg-card); }

    .tab-content { display: none; margin-top: 30px; animation: fadeIn 0.4s ease-out forwards; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .section-title { font-size: 1.25rem; font-weight: 700; color: #000000; margin: 40px 0 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

    table { width: 100%; border-collapse: collapse; background: var(--bg-card); margin-bottom: 25px; }
    th, td { border: 1px solid #edf2f7; padding: 16px; text-align: left; }
    th { background-color: #f8fafc; font-weight: 700; }

    .module-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .module-item { background-color: var(--bg-card); border-radius: var(--border-radius); padding: 24px; border: 1px solid var(--border-color); }
    .module-item strong { color: var(--primary-color); display: block; margin-bottom: 12px; }

    .cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
    .cert-thumb { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; cursor: pointer; }

    /* MODAL ĐÃ SỬA: Đen tuyền toàn bộ */
    .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); backdrop-filter: blur(5px); }
    .modal-container { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; padding: 20px; }
    .modal-content { max-width: 90%; max-height: 80vh; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); }
    .modal-caption-text { color: #ffffff; text-align: center; margin-top: 20px; font-size: 1.2rem; }
    .close-modal { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; cursor: pointer; }
    .prev, .next { cursor: pointer; position: absolute; top: 50%; padding: 16px; color: white; font-size: 30px; }
    .prev { left: 20px; } .next { right: 20px; }
</style>

<script>
    function openTab(evt, tabName) {
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    let currentSlideIndex = 0;
    function openLightbox(element) {
        const modal = document.getElementById("certModal");
        modal.style.display = "block";
        const allThumbs = Array.from(document.querySelectorAll(".cert-thumb"));
        currentSlideIndex = allThumbs.indexOf(element);
        updateModal();
    }
    function closeLightbox() { document.getElementById("certModal").style.display = "none"; }
    function changeSlide(n) {
        const allThumbs = document.querySelectorAll(".cert-thumb");
        currentSlideIndex = (currentSlideIndex + n + allThumbs.length) % allThumbs.length;
        updateModal();
    }
    function updateModal() {
        const allThumbs = document.querySelectorAll(".cert-thumb");
        document.getElementById("modalImage").src = allThumbs[currentSlideIndex].src;
        document.getElementById("modalCaption").innerHTML = allThumbs[currentSlideIndex].nextElementSibling.innerHTML;
    }
</script>
</head>

<body>
<header>
    <div class="avatar-container"><img src="avatar.jpg" alt="Phạm Thị Xuân Trúc"></div>
    <div class="intro">
        <h1>Truc Pham</h1>
        <p class="info">An English Lecturer with an academic background in English Linguistics and Methodology, experienced in higher education and professional training.</p>
    </div>
</header>

<div class="tabs">
    <button class="tab-button" onclick="openTab(event,'education_work')">🎓 Education & Experience</button>
    <button class="tab-button" onclick="openTab(event,'teaching_modules')">📘 Teaching Modules</button>
    <button class="tab-button" onclick="openTab(event,'certification')">📜 Certification</button>
</div>

<!-- Nội dung rút gọn cho demo, bạn giữ lại nội dung cũ của bạn -->
<div id="education_work" class="tab-content">...</div>
<div id="teaching_modules" class="tab-content">...</div>

<div id="certification" class="tab-content">
    <div class="section-title">📜 Academic & Professional Certificates</div>
    <div class="cert-grid">
        <div class="cert-item"><img src="CertPR_17.png" class="cert-thumb" onclick="openLightbox(this)"><div class="cert-caption">Mekong TESOL</div></div>
        <div class="cert-item"><img src="53.jpg" class="cert-thumb" onclick="openLightbox(this)"><div class="cert-caption">ISC 2025</div></div>
    </div>

    <!-- MODAL ĐÃ CHỈNH SỬA -->
    <div id="certModal" class="modal">
        <span class="close-modal" onclick="closeLightbox()">&times;</span>
        <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
        <div class="modal-container">
            <img class="modal-content" id="modalImage">
            <div class="modal-caption-text" id="modalCaption"></div>
        </div>
        <a class="next" onclick="changeSlide(1)">&#10095;</a>
    </div>
</div>

</body>
</html>
